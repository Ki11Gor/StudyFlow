<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow | Предмети</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="app-page">

    <aside class="sidebar">
        <h2>StudyFlow</h2>

        <nav>
            <a href="/">Головна</a>
            <a href="/subjects" class="active">Предмети</a>
            <a href="/tasks">Завдання</a>
            <a href="/statistics">Статистика</a>
        </nav>

        <a href="/login" class="logout-link">Вийти</a>
    </aside>

    <main class="main-content">
        <div class="page-header subjects-header">
            <h1>Предмети</h1>
            <button id="show-subject-form" class="primary-button">
                + Додати предмет
            </button>
        </div>

        <form id="subject-form" class="subject-form hidden">
            <input
                type="text"
                id="subject-name"
                placeholder="Назва предмета"
                required
            >
            <button type="submit" class="primary-button">Додати</button>
            <button type="button" id="cancel-subject" class="secondary-button">
                Скасувати
            </button>
        </form>

        <p id="subjects-loading">Завантаження...</p>
        <p id="subjects-message" class="error-message"></p>

        <div id="subjects-list" class="subjects-grid"></div>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
